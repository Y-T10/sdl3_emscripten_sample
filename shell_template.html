<body>
    <div class="body">
        <div class="canvas_border">
            <!-- テキストの書き出し先 -->
            <p id="text"></p>
            <!-- このキャンバスがウィンドウに当たる -->
            <canvas class="sdl_window" id="canvas" tabindex=-1></canvas>

    <script type='text/javascript'>
        // Emscripten のモジュールクラス
        class EmModule {
            constructor() {
                // SDL3の描画先キャンバスを設定
                this.canvas = document.getElementById('canvas');
            }
        };
        // モジュールオブジェクトを生成する
        let Module = new EmModule();
    </script>
